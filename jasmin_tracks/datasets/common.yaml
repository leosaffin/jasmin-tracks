    - vorticity700hpa
    - vorticity500hpa
    - vorticity300hpa
    - vorticity200hpa
  three_level_vorticity:
    - vorticity850hpa
    - vorticity500hpa
    - vorticity200hpa
  winds_pressure:
    - vmax925hpa
    - vmax10m
    - mslp
  standard_track:
    - seven_level_vorticity
    - mslp
    - vmax925hpa
    - vmax10m
  cyclone_phase_space:
