# Shared path templates and variable sets.
path_templates:
  YYYYMMDDHH: "{year:04d}{month:02d}{day:02d}{hour:02d}"
  YYYYMMDDHH_model: "{model_year:04d}{month:02d}{day:02d}{hour:02d}"
variable_sets:
  seven_level_vorticity:
    - vorticity850hpa
    - vorticity700hpa
    - vorticity600hpa
    - vorticity500hpa
    - vorticity400hpa
    - vorticity300hpa
    - vorticity200hpa
  six_level_vorticity:
    - vorticity850hpa
    - vorticity700hpa
    - vorticity500hpa
    - vorticity400hpa
    - vorticity300hpa
    - vorticity200hpa
  five_level_vorticity:
